global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "neurowealth-vault"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # NeuroWealth Vault metrics (when monitoring service exports Prometheus metrics)
  - job_name: "neurowealth-vault"
    static_configs:
      - targets: ["localhost:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s
